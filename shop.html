function renderCartDrawer() {
  const body = $("#cart-drawer-body");
  const footer = $("#cart-drawer-footer");
  if (Cart.items.length === 0) {
    const topThree = getTopSellers(3).map(x => x.p);
    const popularHtml = topThree.length > 0 ? (
      '<div class="cart-empty__popular">' +
        '<div class="cart-empty__popular-head">' + esc(t('cart_empty_popular')) + '</div>' +
        '<div class="cart-empty__popular-list">' +
          topThree.map(p => 
            '<a href="#product?id=' + esc(p.id) + '" class="cart-empty__popular-item" data-cart-close>' +
              '<div class="cart-empty__popular-img"><img src="' + esc(productImg(p, p.colors[0])) + '" alt="' + esc(pShortName(p)) + '" loading="lazy"/></div>' +
              '<div class="cart-empty__popular-meta">' +
                '<div class="cart-empty__popular-name">' + esc(pShortName(p)) + '</div>' +
                '<div class="cart-empty__popular-price tabular">' + fmt(p.price) + '</div>' +
              '</div>' +
            '</a>'
          ).join('') +
        '</div>' +
      '</div>'
    ) : '';
    body.innerHTML =
      '<div class="cart-empty">' +
        '<div class="cart-empty__icon">' +
          '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18h36l-3 24h-30zM16 18l-2-8H4"/><circle cx="22" cy="50" r="3"/><circle cx="46" cy="50" r="3"/><path d="M28 28v8M36 28v8" stroke-linecap="round"/></svg>' +
        '</div>' +
        '<p class="cart-empty__title">' + esc(t('cart_empty')) + '</p>' +
        '<p class="cart-empty__sub">' + esc(t('cart_empty_sub')) + '</p>' +
        '<a href="#home" class="btn btn-primary btn-md" data-cart-close>' + esc(t('cart_to_catalog')) +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>' +
        '</a>' +
        popularHtml +
      '</div>';
    footer.innerHTML = "";
    return;
  }
  const rows = Cart.items.map(item => {
    const p = PRODUCTS.find(x => x.id === item.id); if (!p) return "";
    return '<div class="cart-row">' +
      '<a href="#product?id=' + p.id + (item.color ? '&c=' + item.color : '') + '" class="cart-row__img" data-cart-close>' +
        '<img src="' + productImg(p, item.color) + '" alt="' + esc(pShortName(p)) + '" loading="lazy" decoding="async"/>' +
      '</a>' +
      '<div class="cart-row__main">' +
        '<div class="cart-row__head">' +
          '<a href="#product?id=' + p.id + (item.color ? '&c=' + item.color : '') + '" class="cart-row__name" data-cart-close>' + esc(pShortName(p)) + '</a>' +
          '<button type="button" class="cart-row__remove" data-rem="' + p.id + '" data-rem-c="' + (item.color || '') + '" aria-label="' + esc(t('cart_remove')) + '">' +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button>' +
        '</div>' +
        (item.color ? '<div class="cart-row__variant">' + esc(colorName(item.color)) + '</div>' : '') +
        '<div class="cart-row__bottom">' +
          '<div class="qty">' +
            '<button type="button" data-dec="' + p.id + '" data-dec-c="' + (item.color || '') + '" aria-label="−">−</button>' +
            '<span class="v tabular">' + item.qty + '</span>' +
            '<button type="button" data-inc="' + p.id + '" data-inc-c="' + (item.color || '') + '" aria-label="+">+</button>' +
          '</div>' +
          '<span class="cart-row__price tabular">' + fmt(p.price * item.qty) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  body.innerHTML = shippingProgressHtml() + bundleHintHtml() + rows;

  const sub = Cart.subtotal();
  const disc = Cart.discount();
  const total = sub - disc;
  footer.innerHTML =
    '<dl class="cart-totals">' +
      '<div><dt>' + esc(t('cart_subtotal')) + '</dt><dd class="tabular">' + fmt(sub) + '</dd></div>' +
      (disc > 0 ? '<div><dt style="color: var(--success); font-weight: 600;">' + esc(t('cart_discount')) + '</dt><dd class="tabular" style="color: var(--success);">−' + fmt(disc) + '</dd></div>' : '') +
      '<div style="font-size: var(--text-xs); color: var(--text-muted);">' +
        '<dt>' + esc(t('cart_shipping')) + '</dt><dd>' + esc(t('cart_shipping_calc')) + '</dd>' +
      '</div>' +
    '</dl>' +
    '<a href="#checkout" class="btn btn-primary btn-block btn-lg" data-cart-close>' + t('cart_checkout_with_total', { total: fmt(total) }) + '</a>' +
    '<button type="button" class="btn btn-ghost btn-block btn-sm" data-cart-close>' + esc(t('cart_continue')) + '</button>';

  body.querySelectorAll("[data-rem]").forEach(b => b.addEventListener("click", () => {
    Cart.remove(b.dataset.rem, b.dataset.remC || null);
    renderCartDrawer();
  }));
  body.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => {
    const it = Cart.items.find(i => i.id === b.dataset.inc && i.color === (b.dataset.incC || null));
    if (it) Cart.setQty(it.id, it.qty + 1, it.color);
    renderCartDrawer();
  }));
  body.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => {
    const it = Cart.items.find(i => i.id === b.dataset.dec && i.color === (b.dataset.decC || null));
    if (it && it.qty > 1) Cart.setQty(it.id, it.qty - 1, it.color);
    else if (it) Cart.remove(it.id, it.color);
    renderCartDrawer();
  }));
  bindGlobalTriggers();
}

function renderProductCard(p, displayColor) {
  const color = displayColor || (p.colors && p.colors[0]);
  // Чи це варіант одного кольору? (виклик з каталогу при вибраному об'ємі)
  const isVariant = !!displayColor;
  let badges = "";
  if (p.isNew) badges += '<span class="badge badge-accent">' + esc(t('badge_new')) + '</span>';
  if (p.bestseller) badges += '<span class="badge badge-line">' + esc(t('badge_bestseller')) + '</span>';
  if (p.compareAt) badges += '<span class="badge badge-success">−' + Math.round((1 - p.price/p.compareAt) * 100) + '%</span>';
  const oldPrice = p.compareAt ? '<span class="pcard__price-old">' + fmt(p.compareAt) + '</span>' : '';
  const fav = Favs.has(p.id) ? "is-fav" : "";

  // Якщо це окрема кольорова варіація — swatches не показуємо (картка вже про конкретний колір),
  // інакше — як було, показуємо до 5 swatches
  let swatchesBlock = "";
  if (!isVariant) {
    const swatches = (p.colors || []).slice(0, 5).map(c =>
      '<span class="pcard__swatch ' + (c === color ? 'active' : '') + '" data-card-color="' + esc(c) + '" data-pid="' + p.id + '" style="background:' + (COLORS[c] ? COLORS[c].hex : "#ccc") + '" title="' + esc(colorName(c)) + '"></span>'
    ).join("");
    const more = p.colors.length > 5 ? '<span style="font-size: 10px; color: var(--text-muted); margin-left: 4px; align-self: center;">+' + (p.colors.length - 5) + '</span>' : "";
    swatchesBlock = '<div class="pcard__swatches">' + swatches + more + '</div>';
  }

  // Картка варіації: посилання веде на товар з заздалегідь вибраним кольором
  const href = isVariant
    ? ('#product?id=' + p.id + '&c=' + encodeURIComponent(color))
    : ('#product?id=' + p.id);
  // Назва: для варіації додаємо назву кольору, щоб картки не виглядали однаково
  const cardName = isVariant
    ? (esc(pShortName(p)) + ' · <span class="pcard__color-tag">' + esc(colorName(color)) + '</span>')
    : esc(pShortName(p));
  // Унікальний id картки (щоб не було конфліктів між варіаціями однієї моделі)
  const pcardId = isVariant ? (p.id + '__' + color) : p.id;

  return '<article class="pcard" data-pcard-id="' + esc(pcardId) + '">' +
    '<a href="' + href + '" class="pcard__link" aria-label="' + esc(pName(p)) + (isVariant ? ' — ' + esc(colorName(color)) : '') + '"></a>' +
    '<div class="pcard__media" data-volume="' + esc(p.volume || '') + '" data-pid="' + esc(p.id) + '">' +
      (badges ? '<div class="pcard__badges">' + badges + '</div>' : '') +
      '<button type="button" class="pcard__fav ' + fav + '" data-fav="' + p.id + '" aria-label="❤">' +
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
      '</button>' +
      '<img src="' + productImg(p, color) + '" alt="' + esc(pName(p)) + ' — ' + esc(colorName(color)) + '" loading="lazy" decoding="async" data-card-img="' + p.id + '" onload="this.classList.add(\'is-loaded\')" onerror="this.classList.add(\'is-error\')"/>' +
      '<div class="pcard__placeholder" aria-hidden="true">' + esc((p.brand || 'S')[0]) + '</div>' +
      '<button type="button" class="pcard__quick-add" data-quick-add="' + p.id + '" data-quick-color="' + color + '">' +
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>' +
        esc(t('pdp_add_to_cart')) +
      '</button>' +
    '</div>' +
    '<div class="pcard__brand">' + esc(p.brand) + '</div>' +
    '<span class="pcard__name">' + cardName + '</span>' +
    '<div class="pcard__rating">' +
      '<span class="stars">' + starsHtml(p.rating, 11) + '</span>' +
      '<span>' + p.rating + ' (' + p.reviews + ')</span>' +
    '</div>' +
    swatchesBlock +
    '<div class="pcard__row">' +
      '<div class="pcard__price tabular">' + fmt(p.price) + oldPrice + '</div>' +
    '</div>' +
  '</article>';
}

function bindCardActions(scope) {
  scope.querySelectorAll("[data-fav]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const added = Favs.toggle(b.dataset.fav);
    b.classList.toggle("is-fav", added);
    toast(added ? t('fav_added') : t('fav_removed'));
  }));
  scope.querySelectorAll("[data-quick-add]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.quickAdd;
    const color = b.dataset.quickColor || null;
    Cart.add(id, 1, color);
    toast(t('cart_added'));
    setTimeout(openCart, 180);
  }));
  scope.querySelectorAll("[data-card-color]").forEach(s => s.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const pid = s.dataset.pid;
    const c = s.dataset.cardColor;
    const p = PRODUCTS.find(x => x.id === pid); if (!p) return;
    const card = scope.querySelector('[data-pcard-id="' + pid + '"]');
    if (!card) return;
    const im = card.querySelector('[data-card-img="' + pid + '"]');
    if (im) im.src = productImg(p, c);
    card.querySelectorAll("[data-card-color]").forEach(x => x.classList.toggle("active", x === s));
    const qa = card.querySelector("[data-quick-add]");
    if (qa) qa.dataset.quickColor = c;
  }));
}

function renderGallerySection() {

  // Якщо непарна кількість — остання клітинка отримує одне фото.

  for (let i = 0; i < imgs.length; i += 2) {

    cells.push({

      altSrc: second ? second.src : null,
      altAlt: second ? second.alt : null,

  return '<section class="gallery-section reveal" id="gallery">' +
    '<div class="container">' +

/* ===== Gallery rotator — плавне чергування зображень у клітинках ===== */
let _galleryRotateT = null;
function setupGalleryRotator() {
  if (_galleryRotateT) { clearInterval(_galleryRotateT); _galleryRotateT = null; }
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  // Поважаємо налаштування користувача — якщо просять менше анімації, не запускаємо ротацію
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cells = Array.from(grid.querySelectorAll('[data-gallery-cell]'));
  if (cells.length === 0) return;
  cells.forEach((cell, idx) => {
    const imgs = cell.querySelectorAll('img');
    if (imgs.length < 2) return;
    cell._galleryIdx = 0;
    cell._galleryTickStart = Date.now() + idx * 700;
  });
  _galleryRotateT = setInterval(() => {
    // Не крутимо, якщо вкладка прихована — економимо CPU
    if (document.hidden) return;
    cells.forEach(cell => {
      const imgs = cell.querySelectorAll('img');
      if (imgs.length < 2) return;
      if (Date.now() < (cell._galleryTickStart || 0)) return;
      const next = (cell._galleryIdx + 1) % imgs.length;
      imgs[cell._galleryIdx].classList.remove('is-active');
      imgs[next].classList.add('is-active');
      cell._galleryIdx = next;
      const activeSrc = imgs[next].getAttribute('src');
      if (activeSrc) cell.setAttribute('data-glb-src', activeSrc);
    });
  }, 4500);
}

function viewHome(params) {
  const brand = params.get("brand") || "";
  const vol = params.get("vol") || "";
  const colorFilter = params.get("color") || "";
  const sort = params.get("sort") || "featured";
  const cat = params.get("cat") || "";
  const isShop = (parseRoute().name === "shop");

  let list = PRODUCTS.filter(p => isVisible(p));
  if (cat === "accessories") list = list.filter(p => isAccessory(p));
  else if (cat === "sale") list = list.filter(p => p.compareAt && Number(p.compareAt) > Number(p.price));
  if (brand) list = list.filter(p => p.brand === brand);
  if (vol) list = list.filter(p => p.volume === vol);
  if (colorFilter) list = list.filter(p => p.colors.includes(colorFilter));
  if (sort === "price-asc") list.sort((a,b) => a.price - b.price);
  else if (sort === "price-desc") list.sort((a,b) => b.price - a.price);
  else if (sort === "newest") list.sort((a,b) => (b.isNew?1:0) - (a.isNew?1:0));
  else if (sort === "bestsellers") list.sort((a,b) => computeSoldCount(b) - computeSoldCount(a));
  else {
    // Default (featured): 40oz first (90% склада), потім bestseller, потім інші
    list.sort((a,b) => {
      const aIs40 = a.volume === "40oz" ? 1 : 0;
      const bIs40 = b.volume === "40oz" ? 1 : 0;
      if (aIs40 !== bIs40) return bIs40 - aIs40;
      const aBest = a.bestseller ? 1 : 0;
      const bBest = b.bestseller ? 1 : 0;
      if (aBest !== bBest) return bBest - aBest;
      return 0;
    });
  }

  /* ===== Розгортання за кольорами =====
     Якщо вибрано об'єм (наприклад 40oz) — кожен товар "розгортаємо" у окремі картки

     Quencher 40oz Cream, Charcoal, Lilac, Pink і т.д.).
     На вкладці аксесуарів — без розгортання. */
  let displayList = list; // [{p, color?}]
  const expandByColor = !!vol && cat !== "accessories";
  if (expandByColor) {

    list.forEach(p => {

    displayList = expanded;

  const allColorsUsed = [...new Set(PRODUCTS.filter(p => isVisible(p)).flatMap(p => p.colors))];

  // Hero та секції — лише на головній (без фільтрів і не на /shop)

            '<img src="img/q40-spring-front.webp" alt="' + esc(t('coll_q40_title')) + '" loading="lazy" decoding="async"/>' +
            '<div class="coll-card__content">' +
              '<span class="coll-card__badge">' + esc(t('coll_q40_badge')) + '</span>' +
              '<div class="coll-card__title">' + esc(t('coll_q40_title')) + '</div>' +
              '<div class="coll-card__sub">' + esc(t('coll_q40_sub')) + '</div>' +
              '<div class="coll-card__price">' + esc(t('coll_q40_price')) + '</div>' +
            '</div>' +
          '</a>' +
        '</div>' +
      '</div>' +
    '</section>';

    // Галерея — статична сітка фото
    html += renderGallerySection();


    // Топ продажу — авто-сортування
    html += renderTopSection();

    // Відгуки клієнтів — social proof
    html += renderTestimonialsSection();

    // Аксесуари
    html += renderAccessoriesSection();

    // Розпродаж
    html += renderSaleSection();
  }

  if (showCatalog) {
    html += '<section class="catalog">' +
      '<div class="container">' +
        '<div class="catalog__head">' +
          '<h1>' + (cat === "accessories" ? esc(t('sec_acc_title')) : cat === "sale" ? esc(t('sec_sale_title')) : brand ? esc(brand) : esc(t('catalog_title'))) + (vol ? ' · ' + esc(vol) : '') + '</h1>' +
        '</div>' +
        filtersHtml +
        (displayList.length === 0
          ? '<div style="padding: 64px 0; text-align: center; color: var(--text-muted);">' +
            '<h3 style="font-size: var(--text-xl); font-weight: 700;">' + esc(t('no_results')) + '</h3>' +
            '<p style="margin-top: 8px;">' + esc(t('no_results_sub')) + '</p>' +
            '<button type="button" class="btn btn-secondary" id="clearF2" style="margin-top: 16px;">' + esc(t('no_results_clear')) + '</button>' +
          '</div>'
          : '<div class="pgrid">' + displayList.map(item =>
              expandByColor
                ? renderProductCard(item.p, item.color)
                : renderProductCard(item)
            ).join("") + '</div>') +
      '</div>' +
    '</section>';
  }

  if (showHero) {
    html += '<section class="steps reveal">' +
      '<div class="container">' +
        '<div style="text-align: center; margin-bottom: 32px;">' +
          '<h2 style="font-size: var(--text-3xl); font-weight: 800; letter-spacing: -0.02em;">' + esc(t('steps_title')) + '</h2>' +
        '</div>' +
        '<div class="steps__inner">' +
          '<div class="step"><div class="step__num">1</div><div class="step__title">' + esc(t('step1_title')) + '</div><div class="step__desc">' + esc(t('step1_desc')) + '</div></div>' +
          '<div class="step"><div class="step__num">2</div><div class="step__title">' + esc(t('step2_title')) + '</div><div class="step__desc">' + esc(t('step2_desc')) + '</div></div>' +
          '<div class="step"><div class="step__num">3</div><div class="step__title">' + esc(t('step3_title')) + '</div><div class="step__desc">' + esc(t('step3_desc')) + '</div></div>' +
          '<div class="step"><div class="step__num">4</div><div class="step__title">' + esc(t('step4_title')) + '</div><div class="step__desc">' + esc(t('step4_desc')) + '</div></div>' +
        '</div>' +
      '</div>' +
    '</section>';

    html += '<section class="faq-section reveal">' +
      '<div class="container">' +
        '<div class="faq-section__head">' +
          '<h2>' + esc(t('faq_title')) + '</h2>' +
          '<p>' + esc(t('faq_sub')) + '</p>' +
        '</div>' +
        '<div class="faq-list">' +
          [1,2,3,4,5,6].map(i =>
            '<details class="acc">' +
              '<summary>' + esc(t('faq' + i + '_q')) + '</summary>' +
              '<div>' + esc(t('faq' + i + '_a')) + '</div>' +
            '</details>'
          ).join("") +
        '</div>' +
      '</div>' +
    '</section>';
  }

  return html;
}

function viewProduct(params) {
  const id = params.get("id");
  const initialColor = params.get("c");
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return '<div class="container" style="padding: 64px 0; text-align: center;"><h2 style="font-size: var(--text-2xl); font-weight: 700;">' + esc(t('not_found')) + '</h2><a href="#home" style="color: var(--accent); text-decoration: underline;">' + esc(t('back_home')) + '</a></div>';

  const color = (initialColor && p.colors.includes(initialColor)) ? initialColor : p.colors[0];

  let badges = "";
  if (p.isNew) badges += '<span class="badge badge-accent">' + esc(t('badge_new')) + '</span>';
  if (p.bestseller) badges += '<span class="badge badge-line">' + esc(t('badge_bestseller')) + '</span>';
  if (p.compareAt) badges += '<span class="badge badge-success">−' + Math.round((1 - p.price/p.compareAt) * 100) + '%</span>';

  const stockMsg = p.stock === 0
    ? '<span style="color: var(--text-muted);">' + esc(t('pdp_out_of_stock')) + '</span>'
    : p.stock <= 5
      ? '<span style="color: var(--warning); font-weight: 600;">' + t('pdp_low_stock', { n: p.stock }) + '</span>'
      : '<span style="color: var(--success); font-weight: 600;">' + esc(t('pdp_in_stock')) + '</span>';

  const related = PRODUCTS.filter(x => isVisible(x) && x.id !== p.id && (x.brand === p.brand || x.volume === p.volume)).slice(0, 4);
  const reviews = reviewsFor(p.id);

  const colorRow = p.colors.map(c =>
    '<button type="button" class="pdp__color" data-color="' + esc(c) + '" aria-checked="' + (c === color) + '" aria-label="' + esc(colorName(c)) + '" style="--c: ' + (COLORS[c] ? COLORS[c].hex : '#ccc') + '"></button>'
  ).join("");

  const reviewsHtml = reviews.map(r =>
    '<div class="review">' +
      '<div class="review__head">' +
        '<div class="review__avatar">' + esc(r.name.charAt(0)) + '</div>' +
        '<div>' +
          '<div class="review__name">' + esc(r.name) + ' <span class="review__verified">' +
            '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
            esc(t('verified')) +
          '</span></div>' +
        '</div>' +
        '<div class="review__date">' + esc(fmtDate(r.date)) + '</div>' +
      '</div>' +
      '<div class="review__stars">' + starsHtml(r.rating, 13) + '</div>' +
      '<div class="review__text">' + esc(reviewText(r)) + '</div>' +
      (r.color ? '<div class="review__variant">' + esc(t('pdp_color')) + ': ' + esc(colorName(r.color)) + '</div>' : '') +
    '</div>'
  ).join("");

  return '<div class="pdp">' +
    '<div class="container">' +
      '<nav class="pdp__breadcrumb">' +
        '<a href="#home">' + esc(t('catalog')) + '</a> / <a href="#shop?brand=' + encodeURIComponent(p.brand) + '">' + esc(p.brand) + '</a> / <span>' + esc(pShortName(p)) + '</span>' +
      '</nav>' +

      '<div class="pdp__grid">' +
        '<div>' +
          '<div class="pdp__media" data-glb-src="' + esc(productImg(p, color)) + '" data-volume="' + esc(p.volume || '') + '" data-pid="' + esc(p.id) + '" id="pdpMediaWrap">' +
            '<img id="pdpImg" src="' + productImg(p, color) + '" alt="' + esc(pName(p)) + ' — ' + esc(colorName(color)) + '" fetchpriority="high" decoding="async"/>' +
            '<span class="pdp__zoom-hint" aria-hidden="true">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>' +
            '</span>' +
          '</div>' +
          (p.gallery && p.gallery.length > 1 ? '<div class="pdp__thumbs" id="pdpThumbs">' +
            p.gallery.map((src, i) => '<button type="button" class="pdp__thumb' + (i === 0 ? ' active' : '') + '" data-thumb="' + esc(src) + '" aria-label="' + esc(pName(p)) + ' — ракурс ' + (i+1) + '"><img src="' + esc(src) + '" alt="" loading="lazy"/></button>').join("") +
          '</div>' : '') +
        '</div>' +

        '<div class="reveal in">' +
          '<div style="display: flex; gap: 6px; flex-wrap: wrap;">' + badges + '</div>' +
          '<div class="pdp__brand" style="margin-top: 12px;">' + esc(p.brand) + '</div>' +
          '<h1 class="pdp__name">' + esc(pName(p)) + '</h1>' +

function viewCart() {
  if (Cart.items.length === 0) {
    return '<div class="cart-page">' +
      '<div class="container" style="padding: 80px 0;">' +
        '<div class="cart-empty" style="padding: 32px 16px;">' +
          '<div class="cart-empty__icon">' +
            '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18h36l-3 24h-30zM16 18l-2-8H4"/><circle cx="22" cy="50" r="3"/><circle cx="46" cy="50" r="3"/><path d="M28 28v8M36 28v8" stroke-linecap="round"/></svg>' +
          '</div>' +
          '<h1 class="cart-empty__title" style="font-size: var(--text-3xl);">' + esc(t('cart_empty')) + '</h1>' +
          '<p class="cart-empty__sub">' + esc(t('cart_empty_sub')) + '</p>' +
          '<a href="#home" class="btn btn-primary btn-lg">' + esc(t('cart_to_catalog')) +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>' +
          '</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  const sub = Cart.subtotal();
  const disc = Cart.discount();
  const total = sub - disc;
  const lines = Cart.items.map(item => {
    const p = PRODUCTS.find(x => x.id === item.id); if (!p) return "";
    return '<div class="cart-line">' +
      '<a href="#product?id=' + p.id + '" class="cart-line__img">' +
        '<img src="' + productImg(p, item.color) + '" alt="' + esc(pShortName(p)) + '" loading="lazy" decoding="async"/>' +
      '</a>' +
      '<div>' +
        '<a href="#product?id=' + p.id + '" class="cart-line__name">' + esc(pName(p)) + '</a>' +
        (item.color ? '<div class="cart-line__variant">' + esc(t('pdp_color')) + ': ' + esc(colorName(item.color)) + '</div>' : '') +
        '<div class="cart-line__variant tabular">' + fmt(p.price) + ' / ' + esc(t('pieces')) + '</div>' +
        '<div class="cart-line__controls">' +
          '<div class="qty">' +
            '<button type="button" data-dec="' + p.id + '" data-dec-c="' + (item.color || '') + '">−</button>' +
            '<span class="v tabular">' + item.qty + '</span>' +
            '<button type="button" data-inc="' + p.id + '" data-inc-c="' + (item.color || '') + '">+</button>' +
          '</div>' +
          '<button type="button" data-rem="' + p.id + '" data-rem-c="' + (item.color || '') + '" style="font-size: var(--text-sm); color: var(--text-muted); text-decoration: underline;">' + esc(t('cart_remove')) + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="cart-line__total tabular">' + fmt(p.price * item.qty) + '</div>' +
    '</div>';
  }).join("");
  return '<div class="cart-page">' +
    '<div class="container">' +
      '<h1 style="font-size: var(--text-3xl); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 32px;">' + esc(t('cart')) + '</h1>' +
      '<div class="cart-grid">' +
        '<div>' +
          shippingProgressHtml() +
          bundleHintHtml() +
          lines +
          '<div style="margin-top: 16px;"><a href="#home" style="color: var(--text-soft); font-size: var(--text-sm);">← ' + esc(t('cart_continue')) + '</a></div>' +
        '</div>' +
        '<aside class="summary">' +
          '<h2>' + esc(t('cart_subtotal')) + '</h2>' +
          '<div class="summary-line"><span>' + esc(t('cart_subtotal')) + '</span><strong class="tabular">' + fmt(sub) + '</strong></div>' +
          (disc > 0 ? '<div class="summary-line" style="color: var(--success);"><span>' + esc(t('cart_discount')) + '</span><strong class="tabular" style="color: var(--success);">−' + fmt(disc) + '</strong></div>' : '') +
          '<div class="summary-line"><span>' + esc(t('cart_shipping')) + '</span><strong class="tabular" style="color: var(--text-muted); font-size: var(--text-xs);">' + esc(t('cart_shipping_calc')) + '</strong></div>' +
          '<div class="summary-total"><span>' + esc(t('cart_total')) + '</span><span class="tabular">' + fmt(total) + '</span></div>' +
          '<a href="#checkout" class="btn btn-primary btn-lg btn-block" style="margin-top: 16px;">' + esc(t('cart_checkout')) + '</a>' +
          '<p style="text-align: center; font-size: var(--text-xs); color: var(--text-muted); margin-top: 10px;">' + esc(t('cart_secure')) + '</p>' +
        '</aside>' +
      '</div>' +
    '</div>' +
  '</div>';
}

  if (Cart.items.length === 0) {
    return '<div class="container" style="padding: 80px 0;">' +

function viewConfirmation() {

  const lines = order.items.map(item => {
    const p = PRODUCTS.find(x => x.id === item.id); if (!p) return "";
    return '<div class="order-line">' +
      '<div class="order-line__img"><img src="' + productImg(p, item.color) + '" alt="' + esc(pShortName(p)) + '" loading="lazy" decoding="async"/><span class="order-line__qty">' + item.qty + '</span></div>' +
      '<div>' +
        '<div class="order-line__name">' + esc(pShortName(p)) + '</div>' +
        (item.color ? '<div class="order-line__variant">' + esc(colorName(item.color)) + '</div>' : '') +

  /* Compute estimated delivery date (2-3 business days, NP). Shown in shipping block. */
  const ets = (function() {
    const d = new Date();

    return d.toLocaleDateString(I18N[LANG].locale, { day: 'numeric', month: 'long' });
  })();

  /* Map shipping method to readable label */

    "np-locker":  { uk: "Нова Пошта · поштомат",    pl: "Nowa Poczta · paczkomat", en: "Nova Poshta · locker"  },
    "np-courier": { uk: "Нова Пошта · курʼєр",      pl: "Nowa Poczta · kurier",    en: "Nova Poshta · courier" },
  };

  /* Telegram support handle — optional, ONLY a manual button (no auto-open). */
  const tgUser = (BRAND.telegram || "").replace(/^@/, "");

    '<div class="success-page__inner">' +

      /* HERO — animated check + headline */

        '<div class="success-tick" aria-hidden="true">' +
          '<svg viewBox="0 0 52 52" width="56" height="56">' +
            '<circle class="success-tick__circle" cx="26" cy="26" r="24" fill="none" stroke-width="3"/>' +
            '<path class="success-tick__check" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M14 27l8 8 16-16"/>' +
          '</svg>' +
        '</div>' +

        '<p class="success-hero__sub">' + t('conf_sub', { email: esc(order.contact.email) }) + '</p>' +
        '<div class="success-hero__id">' +
          '<span class="success-hero__id-label">' + esc(t('conf_order')) + '</span>' +
          '<code class="success-hero__id-code">' + esc(order.id) + '</code>' +
          '<button type="button" class="success-hero__copy" data-copy-order-id="' + esc(order.id) + '" aria-label="Copy order id">' +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '</button>' +
        '</div>' +
      '</header>' +

      /* DELIVERY + SUMMARY — two-card layout on desktop, stacked on mobile */
      '<div class="success-grid">' +

        /* DELIVERY */
        '<article class="success-card">' +
          '<div class="success-card__head">' +
            '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 9V7a2 2 0 0 0-2-2h-3l-2-2H10L8 5H5a2 2 0 0 0-2 2v2"/><path d="M3 13v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M3 13h18"/></svg>' +
            '<h2>' + esc(t('conf_delivery')) + '</h2>' +
          '</div>' +
          '<dl class="success-dl">' +
            '<div><dt>' + esc(t('field_first')) + '</dt><dd>' + esc(order.shipping.firstName + " " + order.shipping.lastName) + '</dd></div>' +
            '<div><dt>' + esc(t('field_phone')) + '</dt><dd class="tabular">' + esc(order.contact.phone) + '</dd></div>' +

            '<div><dt>' + esc(t('pdp_delivery_estimate')) + '</dt><dd><strong>' + esc(ets) + '</strong></dd></div>' +

        '</article>' +

        /* ORDER SUMMARY */

/* ===== Render dispatcher ===== */
function render() {
  document.documentElement.lang = LANG;
  const route = parseRoute();
  const main = $("#main");
  let html = "";
  let p = null;

  switch (route.name) {
    case "home":
    case "shop":
      html = viewHome(route.params); break;
    case "product":
      p = PRODUCTS.find(x => x.id === route.params.get("id"));
      if (!p) { html = viewNotFound(); break; }
      html = viewProduct(route.params); break;
    case "cart":
      html = viewCart(); break;
    case "checkout":
      html = viewCheckout(); break;
    case "confirmation":
      html = viewConfirmation(); break;
    case "login":
      html = viewLogin(); break;
    case "register":
      html = viewRegister(); break;
    case "account":
      html = viewAccount(); break;
    case "wishlist":
      html = viewWishlist(); break;
    case "orders":
      html = viewOrders(); break;
    case "shipping":
    case "returns":
    case "warranty":
    case "contact":
    case "privacy":
    case "terms":
    case "forgot":
      html = viewDoc(route.name); break;
    default:
      html = viewNotFound();
  }

  main.innerHTML = html;
  // Smooth page transition — fade-in
  main.classList.remove("is-entering");
  // Force reflow
  void main.offsetHeight;
  main.classList.add("is-entering");
  // Update all data-i18n elements (cart drawer title, etc)
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = t(key);
  });
  setPageTitle(route.name, p);

  renderAnnounce();
  renderHeader();
  renderFooter();
  renderMobileMenu();
  attachReveals(main);

  bindCardActions(main);
  bindRouteSpecific(route);
  bindGlobalTriggers();
  bindGallery(main);


  // Sticky CTA + FAB visibility
  setupStickyCta(route, p);
  setupFab(route);
  setupActivityTicker(route);
  setupGalleryRotator();
  setupReviewForm();

  // Скролл до секції на головній за параметром ?to=...
  const toId = route.params.get("to");
  if (toId) {
    const target = document.getElementById(toId);
    if (target) {
      // Невелика затримка — даємо час reveal-обсерверу і шрифтам
      setTimeout(() => {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
      return;
    }
  }
  // Scroll to top on route change
  window.scrollTo(0, 0);
}

/* ===== Lightbox для галереї ===== */
function bindGallery(scope) {
  // При зміні маршруту — гарантовано закриваємо лайтбокс
  const existingGlb = document.getElementById("glb-host");
  if (existingGlb) {
    existingGlb.classList.remove("is-open");
    document.body.style.overflow = "";
  }

  const items = scope.querySelectorAll("[data-glb-src]");
  if (!items.length) return;
  let glb = document.getElementById("glb-host");
  if (!glb) {
    glb = document.createElement("div");
    glb.id = "glb-host";
    glb.className = "glb";
    glb.setAttribute("role", "dialog");
    glb.setAttribute("aria-modal", "true");
    glb.setAttribute("aria-label", "Image preview");
    glb.innerHTML =
      '<button class="glb__close" aria-label="Close" type="button">' +
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
      '</button>' +
      '<img alt="" />';
    document.body.appendChild(glb);
    glb.addEventListener("click", e => {
      if (e.target === glb || e.target.closest(".glb__close")) closeGlb();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && glb.classList.contains("is-open")) closeGlb();
    });
  }
  function closeGlb() {
    glb.classList.remove("is-open");
    document.body.style.overflow = "";
  }
  items.forEach(it => {
    it.addEventListener("click", () => {
      const src = it.getAttribute("data-glb-src");
      const img = it.querySelector("img");
      glb.querySelector("img").src = src;
      glb.querySelector("img").alt = (img && img.alt) || "";
      glb.classList.add("is-open");
      document.body.style.overflow = "hidden";
    });
  });
}

  if (route.name === "home" || route.name === "shop") {
    // Filter pills
    $$("[data-brand]").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.brand;
      const params = new URLSearchParams(location.hash.split("?")[1] || "");
      if (v) params.set("brand", v); else params.delete("brand");
      location.hash = "shop?" + params.toString();
    }));
    $$("[data-vol]").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.vol;
      const params = new URLSearchParams(location.hash.split("?")[1] || "");
      if (v) params.set("vol", v); else params.delete("vol");
      location.hash = "shop?" + params.toString();
    }));
    $$("[data-color]").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.color;
      const params = new URLSearchParams(location.hash.split("?")[1] || "");
      if (params.get("color") === v) params.delete("color");
      else params.set("color", v);
      location.hash = "shop?" + params.toString();
    }));
    const sortSel = $("#sortSel");
    if (sortSel) sortSel.addEventListener("change", () => {
      const params = new URLSearchParams(location.hash.split("?")[1] || "");
      params.set("sort", sortSel.value);
      location.hash = "shop?" + params.toString();
    });
    const cf = $("#clearF"); if (cf) cf.addEventListener("click", () => location.hash = "shop");
    const cf2 = $("#clearF2"); if (cf2) cf2.addEventListener("click", () => location.hash = "shop");
  }

  if (route.name === "product") {
    bindPDP(route.params);
  }

  if (route.name === "cart") {
    $$("[data-rem]").forEach(b => b.addEventListener("click", () => {
      Cart.remove(b.dataset.rem, b.dataset.remC || null);
      render();
    }));
    $$("[data-inc]").forEach(b => b.addEventListener("click", () => {
      const it = Cart.items.find(i => i.id === b.dataset.inc && i.color === (b.dataset.incC || null));
      if (it) Cart.setQty(it.id, it.qty + 1, it.color);
      render();
    }));
    $$("[data-dec]").forEach(b => b.addEventListener("click", () => {
      const it = Cart.items.find(i => i.id === b.dataset.dec && i.color === (b.dataset.decC || null));
      if (it && it.qty > 1) Cart.setQty(it.id, it.qty - 1, it.color);
      else if (it) Cart.remove(it.id, it.color);
      render();
    }));
  }

  if (route.name === "checkout") {
    bindCheckout();
  }

  if (route.name === "login") {
    const f = $("#loginForm");
    if (f) f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("#email").value.trim();
      const pw = $("#password").value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(t('err_email'), "error"); return; }
      if (pw.length < 6) { toast(t('pw_min_login'), "error"); return; }

      /* Real auth: verifies pwHash against stored salt+hash for this email. */
      const submitBtn = f.querySelector("button[type='submit']");
      if (submitBtn) { submitBtn.disabled = true; }
      try {
        const result = await window.AUTH.login({ email, password: pw });
        if (!result.ok) {
          /* Generic message — same wording for "no such user" and "wrong password"
             to prevent account enumeration. */
          toast(t('login_failed') || "Невірний email або пароль", "error");
          return;
        }
        toast(t('login_done'));
        location.hash = "account";
        setTimeout(render, 80);
      } finally {
        if (submitBtn) { submitBtn.disabled = false; }
      }
    });
  }

  if (route.name === "register") {
    const f = $("#regForm");
    if (f) f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("#email").value.trim();
      const pw = $("#password").value;
      const fn = $("#firstName").value.trim();
      const ln = $("#lastName").value.trim();
      if (!fn || !ln) { toast(t('fill_all'), "error"); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(t('err_email'), "error"); return; }
      if (pw.length < 8) { toast(t('pw_min'), "error"); return; }

      const submitBtn = f.querySelector("button[type='submit']");
      if (submitBtn) { submitBtn.disabled = true; }
      try {
        const result = await window.AUTH.register({
          email, password: pw, firstName: fn, lastName: ln,
        });
        if (!result.ok) {
          if (result.error === "EMAIL_TAKEN") {
            toast(t('email_taken') || "Цей email уже зареєстровано. Увійдіть.", "error");
          } else {
            toast(t('register_failed') || "Не вдалось створити акаунт", "error");
          }
          return;
        }
        toast(t('register_done'));
        location.hash = "account";
        setTimeout(render, 80);
      } finally {
        if (submitBtn) { submitBtn.disabled = false; }
      }
    });
  }

  if (route.name === "account") {
    const lo = $("#logoutBtn");
    if (lo) lo.addEventListener("click", () => {
      User.logout();
      toast(t('logout_done'));
      /* Reset hash so re-entering #account shows guest view */
      location.hash = "home";
      setTimeout(render, 80);
    });
  }

  if (route.name === "wishlist") {
    const cb = $("[data-fav-clear]");
    if (cb) cb.addEventListener("click", () => {
      if (!Favs.items.length) return;
      Favs.items = [];
      Favs.save();
      toast(t('fav_removed'));
      render();
    });
  }
}

/* ===== PDP bindings ===== */
function bindPDP(params) {
  const id = params.get("id");
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  // Track recently viewed
  try {
    let viewed = JSON.parse(localStorage.getItem("dua_viewed") || "[]");
    viewed = viewed.filter(v => v !== id);
    viewed.unshift(id);
    if (viewed.length > 6) viewed = viewed.slice(0, 6);
    localStorage.setItem("dua_viewed", JSON.stringify(viewed));
  } catch(e) {}

  let qty = 1;
  let currentColor = (params.get("c") && p.colors.includes(params.get("c"))) ? params.get("c") : p.colors[0];

  $$("[data-color]", $("#colorRow")).forEach(b => b.addEventListener("click", () => {
    currentColor = b.dataset.color;
    $$("[data-color]", $("#colorRow")).forEach(x => x.setAttribute("aria-checked", x.dataset.color === currentColor ? "true" : "false"));
    $("#colorLabel").textContent = colorName(currentColor);
    const newSrc = productImg(p, currentColor);
    const im = $("#pdpImg"); if (im) im.src = newSrc;
    const wrap = $("#pdpMediaWrap"); if (wrap) wrap.setAttribute("data-glb-src", newSrc);
    // When color changes, deactivate thumbnail highlighting (main img is no longer from gallery)
    $$("[data-thumb]").forEach(t => t.classList.remove("active"));
  }));

  // Gallery thumbnails: click swaps main image
  $$("[data-thumb]").forEach(b => b.addEventListener("click", () => {
    const src = b.dataset.thumb;
    const im = $("#pdpImg"); if (im) im.src = src;
    const wrap = $("#pdpMediaWrap"); if (wrap) wrap.setAttribute("data-glb-src", src);
    $$("[data-thumb]").forEach(x => x.classList.toggle("active", x === b));
  }));

  const qInc = $("#qtyInc"); if (qInc) qInc.addEventListener("click", () => { qty++; $("#qtyV").textContent = qty; });
  const qDec = $("#qtyDec"); if (qDec) qDec.addEventListener("click", () => { if (qty > 1) qty--; $("#qtyV").textContent = qty; });

  const ab = $("#addBtn");
  if (ab) ab.addEventListener("click", () => {
    if (p.stock === 0) { toast(t('notify_when_available')); return; }
    Cart.add(p.id, qty, currentColor);
    toast(t('cart_added'));
    setTimeout(openCart, 220);
  });

  const fb = $("#favBtn");
  if (fb) fb.addEventListener("click", () => {
    const added = Favs.toggle(p.id);
    const svg = fb.querySelector("svg");
    if (svg) svg.setAttribute("fill", added ? "currentColor" : "none");
    toast(added ? t('fav_added') : t('fav_removed'));
  });
}

/* ===== Checkout bindings ===== */
function bindCheckout() {
  const f = window._co || {};
  const sub = Cart.subtotal();
  const disc = Cart.discount();
  const subAfter = sub - disc;
  const codFee = () => f.payment === "cod" ? 20 : 0;
  function shipPrice(method) {
    if (method === "np-courier") return 120;
    if (method === "ukrposhta") return 50;
    if (method === "np-locker") return subAfter >= BRAND.freeShippingFrom ? 0 : 80;
    if (method === "np-branch") return subAfter >= BRAND.freeShippingFrom ? 0 : 80;
    return 0;
  }
  function recalc() {
    const ship = shipPrice(f.shipping);
    const total = subAfter + ship + codFee();
    const osShip = $("#osShip"); if (osShip) osShip.textContent = fmt(ship);
    const osTotal = $("#osTotal"); if (osTotal) osTotal.textContent = fmt(total);
    const po = $("#placeOrder");
    if (po) po.textContent = t('place_order', { total: fmt(total) });
  }

  // Shipping radios
  $$("[data-shipping]").forEach(c => c.addEventListener("click", () => {
    f.shipping = c.dataset.shipping;
    $$("[data-shipping]").forEach(x => x.classList.toggle("checked", x === c));
    recalc();
  }));

  // Payment radios — only LiqPay shows the card form (Privat24/Mono/Apple/Google/COD redirect externally)
  $$("[data-payment]").forEach(c => c.addEventListener("click", () => {
    f.payment = c.dataset.payment;
    $$("[data-payment]").forEach(x => x.classList.toggle("checked", x === c));
    const card = $("#cardFields");
    if (card) card.style.display = f.payment === "liqpay" ? "block" : "none";
    recalc();
  }));

  // Field updates
  ["email","phone","firstName","lastName","city","locker"].forEach(name => {
    const el = $("#f-" + name);
    if (el) {
      el.addEventListener("input", () => {
        f[name] = el.value;
        try {
          const stored = JSON.parse(localStorage.getItem("dua_checkout") || "{}");
          stored[name] = el.value;
          localStorage.setItem("dua_checkout", JSON.stringify(stored));
        } catch(e) {}
        const er = $("#e-" + name);
        if (er) er.classList.remove("show");
        el.classList.remove("error");
      });
      // Real-time validation on blur
      el.addEventListener("blur", () => {
        const v = (el.value || "").trim();
        if (!v) return; // don't validate empty until submit
        if (name === "email") {
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) showError("email", t('err_email'));
        } else if (name === "phone") {
          // UA: must contain at least 9 digits, and accept +380 / 380 / 0 prefixes
          const digits = v.replace(/\D/g, "");
          if (digits.length < 9) showError("phone", t('err_phone'));
        }
      });
    }
  });

  // Phone auto-format: +380 prefix helper
  const phoneEl = $("#f-phone");
  if (phoneEl) phoneEl.addEventListener("input", () => {
    let v = phoneEl.value.replace(/[^\d+]/g, "");
    // If user types "0" first, suggest converting to +380
    if (v.startsWith("0") && v.length > 1) v = "+38" + v;
    if (v.startsWith("380")) v = "+" + v;
    phoneEl.value = v;
    f.phone = v;
  });

  // Card number formatting
  const cardN = $("#f-cardNumber");
  if (cardN) cardN.addEventListener("input", () => {
    let v = cardN.value.replace(/\D/g, "").slice(0, 19);
    cardN.value = v.replace(/(\d{4})(?=\d)/g, "$1 ");
  });
  // Card expiry MM/YY
  const cardE = $("#f-cardExpiry");
  if (cardE) cardE.addEventListener("input", () => {
    let v = cardE.value.replace(/\D/g, "").slice(0, 4);
    if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
    cardE.value = v;
  });
  // CVV
  const cardC = $("#f-cardCvv");
  if (cardC) cardC.addEventListener("input", () => {
    cardC.value = cardC.value.replace(/\D/g, "").slice(0, 4);
  });

  // Terms checkbox
  let termsOk = false;
  const termsCh = $("#termsCh");
  if (termsCh) termsCh.addEventListener("click", e => {
    if (e.target.tagName === "A") return;
    termsOk = !termsOk;
    termsCh.classList.toggle("checked", termsOk);
    const cb = $("#termsBox"); if (cb) cb.checked = termsOk;
  });

  // Place order
  const po = $("#placeOrder");
  if (po) po.addEventListener("click", () => placeOrder(f, recalc, () => termsOk));

  recalc();
}

function showError(name, msg) {
  const er = $("#e-" + name);
  if (er) {
    const sp = er.querySelector("span:last-child");
    if (sp) sp.textContent = msg;
    er.classList.add("show");
  }
  const fld = $("#f-" + name);
  if (fld) fld.classList.add("error");
}

function clearErrors() {
  $$(".field-error").forEach(e => e.classList.remove("show"));
  $$(".input").forEach(i => i.classList.remove("error"));
}

function placeOrder(f, recalc, isTermsOk) {
  clearErrors();
  let bad = false;

  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email || "")) { showError("email", t('err_email')); bad = true; }
  const phNum = (f.phone || "").replace(/\D/g, "");
  // UA mobile: 12 digits with country code (+380) or 9-10 without
  if (phNum.length < 9 || phNum.length > 12) { showError("phone", t('err_phone')); bad = true; }
  if (!(f.firstName || "").trim()) { showError("firstName", t('err_required')); bad = true; }
  if (!(f.lastName || "").trim()) { showError("lastName", t('err_required')); bad = true; }
  if (!(f.city || "").trim()) { showError("city", t('err_required')); bad = true; }
  if (!(f.locker || "").trim()) { showError("locker", t('err_required')); bad = true; }

  // Card validation only for LiqPay (Privat24 / Mono / Apple / Google / COD redirect to external)
  if (f.payment === "liqpay") {
    const cn = ($("#f-cardNumber") ? $("#f-cardNumber").value : "").replace(/\D/g, "");
    if (cn.length < 13 || cn.length > 19) { showError("cardNumber", t('err_card')); bad = true; }
    const cx = $("#f-cardExpiry") ? $("#f-cardExpiry").value : "";
    if (!/^\d{2}\/\d{2}$/.test(cx)) { showError("cardExpiry", t('err_expiry')); bad = true; }
    const cc = ($("#f-cardCvv") ? $("#f-cardCvv").value : "").replace(/\D/g, "");
    if (cc.length < 3 || cc.length > 4) { showError("cardCvv", t('err_cvv')); bad = true; }
    if (!($("#f-cardName") ? $("#f-cardName").value.trim() : "")) { showError("cardName", t('err_required')); bad = true; }
  }

  if (!isTermsOk()) {
    const tch = $("#termsCh"); if (tch) tch.classList.add("shake");
    setTimeout(() => { const t2 = $("#termsCh"); if (t2) t2.classList.remove("shake"); }, 500);
    toast(t('err_terms'), "error");
    bad = true;
  }

  if (bad) return;

  const po = $("#placeOrder");
  if (po) { po.disabled = true; po.textContent = t('processing'); }

  setTimeout(() => {
    const sub = Cart.subtotal();
    const disc = Cart.discount();
    const subAfter = sub - disc;
    let ship = 0;
    if (f.shipping === "np-courier") ship = 120;
    else if (f.shipping === "ukrposhta") ship = 50;
    else if (f.shipping === "np-locker") ship = subAfter >= BRAND.freeShippingFrom ? 0 : 80;
    else if (f.shipping === "np-branch") ship = subAfter >= BRAND.freeShippingFrom ? 0 : 80;
    const codFee = f.payment === "cod" ? 20 : 0;
    const total = +(subAfter + ship + codFee).toFixed(2);

    const order = {
      id: "DUA-" + Date.now().toString(36).toUpperCase(),
      createdAt: new Date().toISOString(),
      items: Cart.items.slice(),
      contact: { email: f.email, phone: f.phone },
      shipping: { method: f.shipping, firstName: f.firstName, lastName: f.lastName, city: f.city, locker: f.locker },
      payment: f.payment,
      subtotal: sub, discount: disc, shippingCost: ship, codFee: codFee, total: total,
      lang: LANG,
    };

    try { localStorage.setItem("dua_last_order", JSON.stringify(order)); } catch(e) {}
    try {
      const all = JSON.parse(localStorage.getItem("dua_orders") || "[]");
      all.unshift(order);
      localStorage.setItem("dua_orders", JSON.stringify(all));
    } catch(e) {}

    // Order is silently forwarded to Telegram via premium-patch.js
    // (sendOrderDirectToBot using sendMediaGroup + sendMessage Bot API).
    // No more window.open("https://t.me/...?text=...") — that was a legacy
    // no-backend hack that broke trust by opening a Telegram popup.
    // The Storage.setItem hook on "dua_orders" handles dispatch automatically.

    Cart.clear();
    location.hash = "confirmation";
  }, 900);
}

/* ===== Sticky CTA on PDP (mobile) ===== */
let stickyCtaIO = null;
function setupStickyCta(route, p) {
  // Remove old
  const existing = $("#sticky-cta-host");
  if (existing) existing.remove();
  document.body.classList.remove("has-sticky-cta");
  if (stickyCtaIO) { stickyCtaIO.disconnect(); stickyCtaIO = null; }

  if (route.name !== "product" || !p) return;
  if (window.innerWidth > 720) return;

  const host = document.createElement("div");
  host.id = "sticky-cta-host";
  host.className = "sticky-cta";
  host.setAttribute("aria-hidden", "true");
  host.innerHTML =
    '<div class="sticky-cta__inner">' +
      '<div class="sticky-cta__price tabular">' + fmt(p.price) + '</div>' +
      '<button type="button" class="btn btn-primary btn-lg" id="stickyAdd">' + esc(t('pdp_add_to_cart')) + '</button>' +
    '</div>';
  document.body.appendChild(host);

  $("#stickyAdd").addEventListener("click", () => {
    const ab = $("#addBtn"); if (ab) ab.click();
  });

  const target = $("#addBtn");
  if (target && "IntersectionObserver" in window) {
    stickyCtaIO = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const visible = e.isIntersecting;
        host.classList.toggle("visible", !visible);
        host.setAttribute("aria-hidden", visible ? "true" : "false");
        document.body.classList.toggle("has-sticky-cta", !visible);
      });
    }, { threshold: 0.1 });
    stickyCtaIO.observe(target);
  }
}

            '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2l2.95 6.55 7.05.83-5.3 4.85L18.18 22 12 18.27 5.82 22l1.48-7.77L2 9.38l7.05-.83L12 2z"/></svg>' +
          '</button>'
        ).join('') +
      '</div>' +
    '</div>' +
    '<div class="review-field">' +
      '<label for="rev-text">' + esc(t('review_text_label')) + ' <span style="color:#c33;">*</span></label>' +
      '<textarea id="rev-text" rows="5" placeholder="' + esc(t('review_text_ph')) + '" maxlength="800" required></textarea>' +
    '</div>' +
    '<div style="display:flex; gap:10px; margin-top:18px;">' +
      '<button type="button" class="btn btn-secondary" data-review-close style="flex:1;">' + esc(t('review_cancel')) + '</button>' +
      '<button type="button" class="btn btn-primary" id="rev-submit" style="flex:2;">' + esc(t('review_submit')) + '</button>' +

  const starsHost = body.querySelector('#rev-stars');

      btn.addEventListener('click', () => {
        currentRating = Number(btn.dataset.rating);

    b.addEventListener('click', closeReviewModal);

    b.addEventListener('click', closeReviewModal);

  // Submit

  if (submitBtn) {
    submitBtn.addEventListener('click', () => {
      const email = (body.querySelector('#rev-email').value || '').trim();
      const name = (body.querySelector('#rev-name').value || '').trim();
      const text = (body.querySelector('#rev-text').value || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {

      if (text.length < 10) {

        lang: LANG,

      if (cardBody) {
        cardBody.innerHTML =
          '<div style="text-align:center; padding:18px 8px 8px;">' +
            '<div style="width:64px; height:64px; border-radius:50%; background: var(--accent-soft); color: var(--accent); margin: 0 auto 18px; display:grid; place-items:center;">' +
              '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg>' +
            '</div>' +
            '<h3 style="margin:0 0 8px; font-family:var(--font-display); font-size:22px;">' + esc(t('review_thanks_title')) + '</h3>' +
            '<p style="margin:0 0 22px; color:var(--text-muted); font-size:14px; line-height:1.5;">' + esc(t('review_thanks_text')) + '</p>' +
            '<button type="button" class="btn btn-primary" data-review-close style="width:100%;">OK</button>' +
          '</div>';
        cardBody.querySelectorAll('[data-review-close]').forEach(b => {
          b.addEventListener('click', closeReviewModal);
        });
      }
      toast(t('review_thanks_title'));
    });
  }
}
function closeReviewModal() {
  const modal = document.getElementById('review-modal');
  if (!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function setupReviewForm() {
  const trigger = document.getElementById('openReviewForm');
  if (trigger) {
    trigger.onclick = (e) => { e.preventDefault(); openReviewModal(); };
  }
  // Закриття по Escape
  if (!window._reviewEscBound) {
    window._reviewEscBound = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeReviewModal();
    });
  }
}

/* ===== Global triggers ===== */
function bindGlobalTriggers() {
  $$("[data-open-cart]").forEach(b => { b.onclick = e => { e.preventDefault(); openCart(); }; });
  $$("[data-cart-close]").forEach(b => { b.onclick = e => { closeCart(); }; });
  $$("[data-open-mm]").forEach(b => { b.onclick = e => { e.preventDefault(); openMM(); }; });
  $$("[data-mm-close]").forEach(b => { b.onclick = () => { closeMM(); }; });
  $$("[data-lang]").forEach(b => { b.onclick = e => { e.preventDefault(); openLangDrawer(); }; });
  $$("[data-lang-close]").forEach(b => { b.onclick = () => { closeLangDrawer(); }; });
  $$("[data-lang-set]").forEach(b => { b.onclick = () => { setLang(b.dataset.langSet); }; });
}

/* ===== Cart change listener — keep pill in sync ===== */
window.addEventListener("cartchange", updateCartPill);
window.addEventListener("favchange", updateFavPill);

/* ===== Init ===== */
/* ===== Scroll state for header ===== */
function setupScrollHeader() {
  let scheduled = false;
  function update() {
    const h = document.querySelector(".site-header");
    if (h) h.classList.toggle("scrolled", window.scrollY > 8);
    scheduled = false;
  }
  window.addEventListener("scroll", () => {
    if (!scheduled) { scheduled = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
}

document.addEventListener("DOMContentLoaded", render);
if (document.readyState !== "loading") render();
window.addEventListener("load", setupScrollHeader);
</script>
