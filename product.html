<style>
:root{--ink:#13251B;--cream:#F6F3EB;--cream2:#ECE7DA;--paper:#fff;--clay:#C0664A;--gold:#C9A86A;--muted:#6A6557;--line:rgba(19,37,27,.1);--r:18px;--ease:cubic-bezier(.22,.61,.36,1);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--serif:"Iowan Old Style",Palatino,Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:40;background:rgba(246,243,235,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .row{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px;overflow-x:auto;scrollbar-width:none}.nav .row::-webkit-scrollbar{display:none}

.logo .dot{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-weight:800;font-size:14px}
.filters{display:flex;gap:18px;font-size:.9rem;font-weight:550;flex:none}.filters a{color:#3a4a40;white-space:nowrap}.filters a:hover{color:var(--clay)}
.tg{background:#229ED9;color:#fff;border-radius:999px;padding:9px 16px;font-size:.85rem;font-weight:650;flex:none}
.crumbs{font-size:.8rem;color:var(--muted);padding:20px 0 4px;display:flex;gap:7px;flex-wrap:wrap}.crumbs a:hover{color:var(--clay)}.crumbs span{opacity:.5}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:42px;padding:18px 0 50px;align-items:start}
.gal{position:sticky;top:90px}
.stage{position:relative;aspect-ratio:1/1.05;background:linear-gradient(160deg,#fff,var(--cream2));border:1px solid var(--line);border-radius:24px;display:grid;place-items:center;overflow:hidden;perspective:1000px}
.stage img{width:78%;height:78%;object-fit:contain;transition:transform .4s var(--ease),opacity .25s;will-change:transform}
.stage.swapping img{opacity:.2}
.gbadge{position:absolute;top:16px;left:16px;background:var(--ink);color:var(--cream);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:999px}.gbadge.gold{background:var(--gold);color:var(--ink)}.gbadge.clay{background:var(--clay)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.thumb:hover{transform:translateY(-2px)}.thumb[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thumb img{width:100%;height:100%;object-fit:contain}
.br{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

.prices b{font-size:1.8rem;letter-spacing:-.01em}.prices s{color:var(--muted);font-size:1.05rem}
.save{background:rgba(192,102,74,.12);color:var(--clay);font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px}
.instock{color:#2e7d52;font-size:13px;font-weight:700;margin-top:10px;display:flex;align-items:center;gap:7px}.instock::before{content:'';width:8px;height:8px;border-radius:50%;background:#2e7d52;box-shadow:0 0 0 3px rgba(46,125,82,.18)}
.swsec{margin:22px 0 6px}.swlbl{font-size:.82rem;font-weight:650;margin-bottom:9px}.swlbl b{color:var(--muted);font-weight:600}

.sw:hover{transform:scale(1.12)}.sw:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);transform:scale(1.06)}
.desc{color:#3a4a40;font-size:.96rem;margin:20px 0;max-width:54ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 8px}
.btn{border-radius:999px;padding:15px 26px;font-size:.95rem;font-weight:700;text-align:center;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s;border:1px solid transparent}
.btn:hover{transform:translateY(-2px)}
.btn-buy{background:var(--ink);color:var(--cream);flex:1;min-width:200px;box-shadow:0 12px 30px -12px rgba(19,37,27,.5)}

.trustline{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:14px}.trustline span{display:flex;align-items:center;gap:6px}
.panel{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
.panel h2{font-size:1.05rem;margin-bottom:14px}
.specs{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.specs li{font-size:.88rem;display:flex;gap:8px;align-items:flex-start;color:#3a4a40}.specs li::before{content:'✓';color:var(--clay);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;font-size:.95rem}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';color:var(--clay);font-weight:800}.faq details[open] summary::after{content:'–'}.faq p{color:var(--muted);font-size:.9rem;margin-top:9px}
.rel{padding:10px 0 60px}.rel h2{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:18px}
.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.rc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s}
.rc:hover{transform:translateY(-4px);box-shadow:0 16px 38px -18px rgba(19,37,27,.28)}
.rc{transform-style:preserve-3d}
.rc .ph{aspect-ratio:1/1.05;background:linear-gradient(160deg,#fff,var(--cream2));display:grid;place-items:center;overflow:hidden}.rc .ph img{width:74%;height:74%;object-fit:contain;transition:transform .25s var(--ease)}
.rc .m{padding:12px 14px 16px}.rc .nm{font-weight:650;font-size:.86rem;line-height:1.3}.rc .pp{margin-top:7px;font-weight:700;font-size:.95rem}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(246,243,235,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s var(--ease)}
.sticky.show{transform:none}
.sticky .in{display:flex;align-items:center;gap:14px;padding:11px 0}
.sticky img{width:42px;height:46px;object-fit:contain;flex:none}
.sticky .nm{font-weight:650;font-size:.82rem;line-height:1.2}.sticky .pp{color:var(--muted);font-size:.82rem}
.sticky .btn-buy{flex:none;min-width:auto;padding:13px 22px;margin-left:auto}
footer{background:var(--ink);color:rgba(246,243,235,.75);padding:40px 0 76px;text-align:center;font-size:.85rem}footer a{color:var(--cream);font-weight:650}
.miss{text-align:center;padding:80px 0}.miss h1{margin-bottom:10px}.miss a{color:var(--clay);font-weight:700}
@media(max-width:860px){.prod{grid-template-columns:1fr;gap:24px}.gal{position:static}.specs{grid-template-columns:1fr}.relgrid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.stage img,.sw,.btn,.rc{transition:none}}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:3px}:focus:not(:focus-visible){outline:none}
.btn:active{transform:translateY(0) scale(.98)}.thumb:active,.sw:active{transform:scale(.95)}

<script>
(function(){
  var TG='https://t.me/stanley_brand_ua';
  var app=document.getElementById('app');
  var sticky=document.getElementById('sticky');
  var fmt=function(n){return (n||0).toLocaleString('uk-UA').replace(/,/g,' ')+' ₴';};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var qid=new URLSearchParams(location.search).get('id');

  fetch('catalog-data.json').then(function(r){return r.json();}).then(function(data){
    var all=(data&&data.products)||[];
    var prod=all.filter(function(p){return p.id===qid;})[0]||all[0];
    if(!prod){ app.innerHTML='<div class="miss"><h1>Товар не знайдено</h1><p class="subv">Можливо, його вже розібрали.</p><p style="margin-top:14px"><a href="catalog.html">← До каталогу</a></p></div>'; return; }
    render(prod, all);
  }).catch(function(){
    app.innerHTML='<div class="miss"><h1>Не вдалося завантажити товар</h1><p style="margin-top:14px"><a href="catalog.html">← До каталогу</a></p></div>';
  });

  function variantsOf(p, all){
    var key=[p.brand,p.model,p.volume].join('|');
    return all.filter(function(x){return [x.brand,x.model,x.volume].join('|')===key;});
  }

  function render(p, all){
    var variants=variantsOf(p, all);
    var related=all.filter(function(x){return x.category===p.category && variantsOf(x,all)[0]!==variants[0];});
    // de-dup related to one card per variant-group, max 4
    var seen={}, rel=[];
    related.forEach(function(x){var k=[x.brand,x.model,x.volume].join('|'); if(seen[k])return; seen[k]=1; rel.push(x);});
    rel=rel.slice(0,4);

    var hasSave=p.compareAt && p.compareAt>p.price;
    var badge=p.badge||'';
    var badgeCls = /лімітк|love|starbucks|колаб/i.test((badge+p.category+p.model)) ? 'gold' : 'clay';

    app.innerHTML=''+
      '<nav class="crumbs"><a href="index.html">Головна</a><span>/</span><a href="catalog.html">Каталог</a><span>/</span><a href="catalog.html">'+esc(p.category)+'</a><span>/</span>'+esc(p.color&&p.color!=='—'?p.model:p.name)+'</nav>'+
      '<section class="prod">'+
        '<div class="gal">'+
          '<div class="stage" id="stage">'+(badge?'<span class="gbadge '+badgeCls+'">'+esc(badge)+'</span>':'')+
            '<img id="hero" src="'+esc(p.img)+'" alt="'+esc(p.alt||p.name)+'"></div>'+
          '<div class="thumbs" id="thumbs"></div>'+
        '</div>'+
        '<div class="info">'+
          '<div class="br">'+esc(p.brand)+'</div>'+
          '<h1 id="pname">'+esc(p.name)+'</h1>'+
          '<div class="subv" id="psub">'+esc([p.volume&&p.volume!=='—'?p.volume:'',p.color&&p.color!=='—'?p.color:''].filter(Boolean).join(' · '))+'</div>'+
          '<div class="prices"><b id="pprice">'+fmt(p.price)+'</b>'+(hasSave?'<s id="pcompare">'+fmt(p.compareAt)+'</s><span class="save" id="psave">−'+Math.round((1-p.price/p.compareAt)*100)+'%</span>':'')+'</div>'+
          '<div class="instock">В наявності · готово до відправки</div>'+
          (variants.length>1?'<div class="swsec"><div class="swlbl">Колір: <b id="swname">'+esc(p.color)+'</b></div><div class="sws" id="sws"></div></div>':'')+
          '<p class="desc" id="pdesc">'+esc(p.desc||'')+'</p>'+
          '<div class="cta"><a class="btn btn-buy" href="'+TG+'" target="_blank" rel="noopener">Замовити в Telegram →</a><a class="btn btn-ghost" href="catalog.html">Весь каталог</a></div>'+
          '<div class="trustline"><span>🛡️ 100% оригінал</span><span>⚡ Відправка 1–2 дні</span><span>🎁 Подарункова упаковка</span><span>↺ Обмін 14 днів</span></div>'+
          (p.specs&&p.specs.length?'<div class="panel"><h2>Характеристики</h2><ul class="specs">'+p.specs.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>':'')+
          (p.advantages&&p.advantages.length?'<div class="panel"><h2>Переваги</h2><div class="chips">'+p.advantages.map(function(a){return '<span class="chip">'+esc(a)+'</span>';}).join('')+'</div></div>':'')+
          (p.faq&&p.faq.length?'<div class="panel faq"><h2>Часті запитання</h2>'+p.faq.map(function(f){return '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>';}).join('')+'</div>':'')+
        '</div>'+
      '</section>'+
      (rel.length?'<section class="rel"><h2>Схожі товари</h2><div class="relgrid">'+rel.map(function(x){return '<a class="rc" href="product.html?id='+encodeURIComponent(x.id)+'"><div class="ph"><img loading="lazy" src="'+esc(x.img)+'" alt="'+esc(x.alt||x.name)+'"></div><div class="m"><div class="nm">'+esc(x.name)+'</div><div class="pp">'+fmt(x.price)+'</div></div></a>';}).join('')+'</div></section>':'');

    buildSwatches(p, variants);
    buildThumbs(p);
    seo(p);
    tilt(document.getElementById('stage'), document.getElementById('hero'));
    tiltCards('.relgrid .rc');
    setupSticky(p);
    history.replaceState(null,'','product.html?id='+encodeURIComponent(p.id));
  }

  // current product state for swatch switching (without full re-render)
  var cur;
  function applyVariant(v, variants){
    cur=v;
    var stage=document.getElementById('stage'), hero=document.getElementById('hero');
    var apply=function(){
      hero.src=v.img; hero.alt=v.alt||v.name; stage.classList.remove('swapping');
      var pn=document.getElementById('pname'); if(pn) pn.textContent=v.name;
      var ps=document.getElementById('psub'); if(ps) ps.textContent=[v.volume&&v.volume!=='—'?v.volume:'',v.color&&v.color!=='—'?v.color:''].filter(Boolean).join(' · ');
      var pp=document.getElementById('pprice'); if(pp) pp.textContent=fmt(v.price);
      var s=document.getElementById('pcompare'); if(s) s.textContent=fmt(v.compareAt);
      var sv=document.getElementById('psave'); if(sv&&v.compareAt) sv.textContent='−'+Math.round((1-v.price/v.compareAt)*100)+'%';
      var d=document.getElementById('pdesc'); if(d) d.textContent=v.desc||'';
      var sn=document.getElementById('swname'); if(sn) sn.textContent=v.color;
    };
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ apply(); }
    else{ stage.classList.add('swapping'); hero.addEventListener('load',apply,{once:true}); setTimeout(apply,260); hero.src=v.img; }
    document.querySelectorAll('#sws .sw').forEach(function(b,i){b.setAttribute('aria-pressed', variants[i]===v?'true':'false');});
    buildThumbs(v);
    updateSticky(v); seo(v);
    history.replaceState(null,'','product.html?id='+encodeURIComponent(v.id));
  }

  function buildSwatches(p, variants){
    if(variants.length<2) return;
    var wrap=document.getElementById('sws'); if(!wrap) return;
    variants.forEach(function(v){
      var b=document.createElement('button'); b.type='button'; b.className='sw';
      b.style.background=v.colorHex||'#ccc'; b.setAttribute('aria-label',v.color); b.title=v.color;
      b.setAttribute('aria-pressed', v.id===p.id?'true':'false');
      b.addEventListener('click',function(){applyVariant(v,variants);});
      wrap.appendChild(b);
    });
  }
  // gallery thumbnails = available ANGLES (front/back/lid) of the current colour.
  // Alternate shots are discovered by probing derived filenames, so the row only
  // shows angles that actually exist; products with one photo hide the row.
  function angleSrc(src, suffix){ return src.replace(/-front\.(webp|jpe?g|png)$/i, '-'+suffix+'.$1'); }
  function probe(src){ return new Promise(function(res){ var im=new Image(); im.onload=function(){res(true);}; im.onerror=function(){res(false);}; im.src=src; }); }
  function setHero(src, alt){
    var stage=document.getElementById('stage'), hero=document.getElementById('hero');
    if(!hero) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ hero.src=src; if(alt) hero.alt=alt; return; }
    stage.classList.add('swapping');
    var done=function(){ stage.classList.remove('swapping'); };
    hero.addEventListener('load',done,{once:true}); setTimeout(done,260); hero.src=src; if(alt) hero.alt=alt;
  }
  function buildThumbs(v){
    var wrap=document.getElementById('thumbs'); if(!wrap) return;
    wrap.innerHTML=''; wrap.style.display='';
    var cands=[{src:v.img,label:'Спереду'},{src:angleSrc(v.img,'back'),label:'Ззаду'},{src:angleSrc(v.img,'lid'),label:'Кришка'}];
    Promise.all(cands.map(function(c,i){ return i===0||c.src===v.img ? Promise.resolve(i===0) : probe(c.src); })).then(function(oks){
      var seen={}, avail=cands.filter(function(c,i){ if(!oks[i])return false; if(seen[c.src])return false; seen[c.src]=1; return true; });
      if(avail.length<2){ wrap.style.display='none'; return; }
      avail.forEach(function(c,i){
        var t=document.createElement('button'); t.type='button'; t.className='thumb';
        t.setAttribute('aria-current', i===0?'true':'false'); t.title=c.label;
        t.innerHTML='<img loading="lazy" src="'+esc(c.src)+'" alt="'+esc(v.name+' — '+c.label)+'">';
        t.addEventListener('click',function(){
          setHero(c.src, v.name+' — '+c.label);
          wrap.querySelectorAll('.thumb').forEach(function(x){x.setAttribute('aria-current','false');});
          t.setAttribute('aria-current','true');
        });
        wrap.appendChild(t);
      });
    });
  }

  function seo(v){
    document.title=v.seoTitle||(v.name+' — купити оригінал | dua');
    var set=function(sel,attr,val){var el=document.querySelector(sel); if(el&&val) el.setAttribute(attr,val);};
    var d=v.seoDesc||v.desc||'';
    set('meta[name=description]','content',d);
    set('meta[property="og:title"]','content',v.name);
    set('meta[property="og:description"]','content',d);
    set('meta[name="twitter:title"]','content',v.name);
    set('meta[name="twitter:description"]','content',d);
    var canon='https://stanleybrand.com.ua/product.html?id='+encodeURIComponent(v.id);
    set('link[rel=canonical]','href',canon);
    set('meta[property="og:url"]','content',canon);
    var img=/^https?:/.test(v.img)?v.img:'https://stanleybrand.com.ua/'+v.img;
    set('meta[property="og:image"]','content',img);
    set('meta[name="twitter:image"]','content',img);
    // JSON-LD
    var old=document.getElementById('ld'); if(old) old.remove();
    var ld=document.createElement('script'); ld.type='application/ld+json'; ld.id='ld';
    ld.textContent=JSON.stringify({"@context":"https://schema.org/","@type":"Product",name:v.name,image:[img],description:v.seoDesc||v.desc||'',brand:{"@type":"Brand",name:v.brand},offers:{"@type":"Offer",priceCurrency:"UAH",price:v.price,availability:"https://schema.org/InStock",url:canon}});
    document.head.appendChild(ld);
  }

  function setupSticky(p){
    cur=p;
    sticky.innerHTML='<div class="wrap in"><img id="sk-img" src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><div><div class="nm" id="sk-nm">'+esc(p.name)+'</div><div class="pp" id="sk-pp">'+fmt(p.price)+'</div></div><a class="btn btn-buy" href="'+TG+'" target="_blank" rel="noopener">Замовити →</a></div>';
    var onScroll=function(){ sticky.classList.toggle('show', scrollY>520); };
    addEventListener('scroll',onScroll,{passive:true}); onScroll();
  }
  function updateSticky(v){
    var i=document.getElementById('sk-img'), n=document.getElementById('sk-nm'), pp=document.getElementById('sk-pp');
    if(i)i.src=v.img; if(n)n.textContent=v.name; if(pp)pp.textContent=fmt(v.price);
  }

  function tilt(stage, img){
    if(!stage||!img) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var raf=0, rx=0, ry=0;
    var apply=function(){ raf=0; img.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)'; };
    stage.addEventListener('pointermove',function(e){
      var r=stage.getBoundingClientRect();
      ry=((e.clientX-r.left)/r.width-0.5)*14; rx=-((e.clientY-r.top)/r.height-0.5)*14;
      if(!raf) raf=requestAnimationFrame(apply);
    });
    stage.addEventListener('pointerleave',function(){ if(raf){cancelAnimationFrame(raf);raf=0;} img.style.transform=''; });
  }

  // 3D-tilt for related-product cards (same feel as the catalog)
  function tiltCards(sel){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    document.querySelectorAll(sel).forEach(function(card){
      var img=card.querySelector('.ph img'); var raf=0, rx=0, ry=0;
      var apply=function(){ raf=0;
        card.style.transform='perspective(800px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY(-4px)';
        if(img) img.style.transform='scale(1.04) translate('+(ry*0.5).toFixed(1)+'px,'+(-rx*0.5).toFixed(1)+'px)';
      };
      card.addEventListener('pointermove',function(e){
        var r=card.getBoundingClientRect();
        ry=((e.clientX-r.left)/r.width-0.5)*10; rx=-((e.clientY-r.top)/r.height-0.5)*10;
        if(!raf) raf=requestAnimationFrame(apply);
      });
      card.addEventListener('pointerleave',function(){ if(raf){cancelAnimationFrame(raf);raf=0;} card.style.transform=''; if(img) img.style.transform=''; });
    });
  }
})();
</script>
