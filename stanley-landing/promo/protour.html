<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{
  font-family:"DM Sans",sans-serif;color:#1F1F1F;position:relative;overflow:hidden;
  background:
    radial-gradient(700px 520px at 30% 58%, #F1DDF0 0%, transparent 70%),
    radial-gradient(640px 520px at 76% 64%, #F7DCCF 0%, transparent 70%),
    radial-gradient(900px 500px at 50% -10%, #FFFFFF 0%, transparent 70%),
    #F3ECE1;
  padding:64px;
}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:30px;letter-spacing:.2em}
.handle{font-size:21px;font-weight:600;color:#1C3A2E;background:rgba(255,255,255,.85);border-radius:999px;padding:11px 20px}
h1{font-family:"Playfair Display",serif;font-weight:500;font-size:132px;line-height:.95;letter-spacing:-.02em;margin-top:40px}
h1 i{font-style:italic}
.lead{font-size:28px;color:#4E4E45;margin-top:18px;line-height:1.35;max-width:820px}
.lead b{color:#1F1F1F}

.stage{position:absolute;left:0;right:0;top:490px;height:550px}
.stage::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:60px;
  background:radial-gradient(closest-side,rgba(70,50,35,.20),transparent)}
.cup{position:absolute;bottom:0;transform:translateX(-50%);filter:drop-shadow(0 26px 24px rgba(60,40,30,.18));z-index:1}
.c30{left:33%;height:550px}
.c20{left:69%;height:440px}  /* 24 см проти 30 см — реальна пропорція */

.cards{position:absolute;left:64px;right:64px;bottom:64px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:rgba(255,255,255,.88);border-radius:28px;padding:24px 26px;box-shadow:0 20px 40px -24px rgba(60,40,30,.3)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.size{font-family:"Playfair Display",serif;font-variant-numeric:lining-nums;font-size:44px;font-weight:600;line-height:1}
.ml{font-size:22px;color:#6B6B5E}
.specs{display:flex;gap:16px;margin:14px 0 18px;font-size:20px;color:#4E4E45}
.specs span{display:flex;align-items:center;gap:6px}
.specs svg{width:22px;height:22px;color:#1C3A2E}
.price{display:inline-block;background:#1C3A2E;color:#fff;border-radius:999px;padding:12px 22px;font-size:32px;font-weight:700}
.price small{font-size:20px;font-weight:600;opacity:.85;margin-left:4px}
.chips{display:flex;gap:10px;margin-top:26px;position:relative;z-index:2}
.chip{background:rgba(255,255,255,.88);border-radius:16px;padding:12px 16px;font-size:19px;font-weight:600;display:flex;gap:10px;align-items:center}
.chip svg{width:24px;height:24px;color:#1C3A2E;flex:none}
</style></head>
<body>
  <div class="top"><div class="brand">STANLEY</div><div class="handle">@stanley_brand_ua</div></div>
  <h1>Pro<i>Tour</i></h1>
  <p class="lead">Кришка <b>Flip Straw</b>: натиснув — трубочка відкрилась. Закрив — <b>не протікає</b> навіть у сумці.</p>

  <div class="chips">
    
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5h11L19 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/></svg>У підстаканник авто</div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Сталь 18/8</div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M7 7V4h10v3M6 7l1 13h10l1-13"/></svg>Можна в посудомийку</div>
  </div>

  <div class="stage">
    <img class="cup c30" src="img/pt30-orchid-front.png" alt="">
    <img class="cup c20" src="img/pt20-peach-front.png" alt="">
  </div>

  <div class="cards">
    <div class="card">
      <div class="row"><span class="size">30 oz</span><span class="ml">887 мл</span></div>
      <div class="specs">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/></svg>холод 11 год</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3c0 2 2 2 2 4s-2 2-2 4M14 3c0 2 2 2 2 4s-2 2-2 4"/><path d="M4 14h16v1a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/></svg>тепло 7 год</span>
      </div>
      <span class="price">3 200<small>грн</small></span>
    </div>
    <div class="card">
      <div class="row"><span class="size">20 oz</span><span class="ml">591 мл</span></div>
      <div class="specs">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/></svg>холод 9 год</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3c0 2 2 2 2 4s-2 2-2 4M14 3c0 2 2 2 2 4s-2 2-2 4"/><path d="M4 14h16v1a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/></svg>тепло 5 год</span>
      </div>
      <span class="price">2 500<small>грн</small></span>
    </div>
  </div>
</body></html>
