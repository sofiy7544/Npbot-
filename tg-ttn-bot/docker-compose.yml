# Production docker-compose.yml for tg-ttn-bot.
# Run: docker-compose up -d --build
#
# Services:
#   - postgres  : PostgreSQL 16 with persistent volume
#   - redis     : Redis 7 (BullMQ + cache + rate-limit)
#   - bot       : Telegram bot process (long-polling or webhook)
#   - worker    : BullMQ workers (TTN creation, sweep)
#   - admin     : Fastify admin API (optional, behind nginx/cloudflare)
#
# Scale workers: docker-compose up -d --scale worker=3

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgbot}
      POSTGRES_DB: ${POSTGRES_DB:-tgttnbot}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Don't expose to host in production — only internal access
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgbot}:${POSTGRES_PASSWORD:-tgbot}@postgres:5432/${POSTGRES_DB:-tgttnbot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgbot}:${POSTGRES_PASSWORD:-tgbot}@postgres:5432/${POSTGRES_DB:-tgttnbot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/jobs/worker.js"]
    networks: [internal]

  # Optional: admin API (uncomment when admin server is needed)
  # admin:
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-tgbot}:${POSTGRES_PASSWORD:-tgbot}@postgres:5432/${POSTGRES_DB:-tgttnbot}
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on: [postgres, redis]
  #   command: ["node", "dist/presentation/admin/server.js"]
  #   networks: [internal, web]
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.tgbot-admin.rule=Host(`admin.example.com`)"

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
  web:
    external: true
