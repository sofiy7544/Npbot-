name: Deploy site to GitHub Pages (manual)

# Deploy runs ONLY when triggered by hand from the Actions tab
# (Actions → "Deploy site to GitHub Pages (manual)" → Run workflow).
# No push / pull_request / schedule triggers — ordinary commits and
# pushes never deploy to production.
on:
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a new manual run supersedes an old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The published site lives in ./docs (the mirror kept in sync with root).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
